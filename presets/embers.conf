# Slow, sparse embers (SPEC §13.3, instanced topology, no ribbon layer): the
# whole preset is one instanced layer. Compared with prefab:spray it emits
# fewer, smaller, softer particles that drift slowly in nearly random
# directions and hang around much longer, instead of streaming behind the
# pointer. Reach is speed * fade_ms plus wobble and size, about 46 px.
#
# The trail buffer holds `capacity` points (default 64), and a point that is
# pushed out of it takes its particles with it, so long-lived embers vanish
# early during long fast strokes. Try `plugin:hyprtail:capacity = 256`.
contract = 2
description = Sparse glowing embers that drift and linger (instanced only)
layers = embers

embers:vertex = prefab:spray.vert
embers:fragment = prefab:dots.frag
embers:fade_ms = 1200
embers:count = 2
embers:size = 2
embers:speed = 24
embers:wobble = 14
embers:trailing = 0.15
embers:color_a = 0xffffd580
embers:color_b = 0xffff3a00
embers:softness = 0.9
