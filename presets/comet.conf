# A short, sharp comet tail: one narrow ribbon that fades almost at once (its
# width tapers with age, so the tail pinches to a point). The color is picked
# by the pointer's speed when each point was recorded, from color_slow (ice
# blue) toward color_fast (hot amber) as speed approaches speed_ref, in px/ms.
# speed_ref is high here, so the hot color only shows on real flicks and
# ordinary motion stays cool. Try `params = "trail:speed_ref=1.5"` to make it
# flare on lighter movement.
contract = 2
description = Short tapered tail, ice blue flaring to amber on fast flicks
layers = trail

trail:vertex = prefab:ribbon.vert
trail:fragment = prefab:ribbon.frag
trail:fade_ms = 160
trail:width = 4
trail:miter_limit = 2
trail:speed_ref = 4
trail:color_slow = 0xff4d8dff
trail:color_fast = 0xffffe27a
