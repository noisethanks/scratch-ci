# The default preset (SPEC §13.7): one narrow path layer, short fade,
# neutral low alpha, no idle layer. Reuses classic's own ribbon shader
# rather than a new one -- see NOTES "Phase 4" for why pinning color_slow
# and color_fast equal is an interim stand-in for a genuine flat-color mode.
contract = 2
description = Thin neutral trail, no idle effect
layers = trail

trail:vertex = classic/ribbon.vert
trail:fragment = classic/ribbon.frag
trail:fade_ms = 300
trail:width = 3
trail:miter_limit = 2
trail:color_slow = 0x40ffffff
trail:color_fast = 0x40ffffff
