# Today's stock look (SPEC §13.7): a narrow speed-tinted ribbon, plus an
# idle ring around the pointer, off by default. Exists so switching to the
# manifest-driven preset system doesn't change anyone's default experience.
contract = 2
description = Speed-tinted ribbon, optional idle ring
layers = trail, idle

trail:vertex = classic/ribbon.vert
trail:fragment = classic/ribbon.frag
trail:fade_ms = 500
trail:width = 8
trail:miter_limit = 2
trail:color_slow = 0xff1a66ff
trail:color_fast = 0xffff1a1a

idle:vertex = classic/ring.vert
idle:fragment = classic/ring.frag
idle:enabled = false
idle:start_ms = 500
idle:duration_ms = 1500
idle:radius = 24
idle:draw_when_cursor_hidden = false
idle:color = 0xff1a66ff
