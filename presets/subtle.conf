# The default preset, "prefab:subtle" (SPEC §13.7): one narrow ribbon, short
# fade, neutral low alpha, no idle layer. color_a and color_b are equal, so
# the color never shifts: a flat-color line.
#
# To edit it: copy this file, unchanged, to
# ~/.config/hypr/hyprtail/presets/subtle.conf and set
# preset = "subtle" (no prefix). "prefab:<name>" is always the embedded
# built-in; a bare name is always your own file. The thread:vertex/fragment
# lines below name the embedded shaders; to edit those too, copy
# shaders/ribbon.vert and shaders/gradient.frag into ~/.config/hypr/hyprtail/
# and change the values to "ribbon.vert" / "gradient.frag" (bare = a path
# relative to ~/.config/hypr/hyprtail/).
contract = 2
description = Thin neutral trail, no idle effect
layers = thread

thread:vertex = prefab:ribbon.vert
thread:fragment = prefab:gradient.frag
thread:fade_ms = 300
thread:width = 3
thread:miter_limit = 2
thread:color_a = 0x40ffffff
thread:color_b = 0x40ffffff
