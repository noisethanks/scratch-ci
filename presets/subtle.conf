# The default preset, "prefab:subtle" (SPEC §13.7): one narrow path layer,
# short fade, neutral low alpha, no idle layer. Reuses classic's own ribbon
# shader rather than a new one -- see NOTES "Phase 4" for why pinning
# color_slow and color_fast equal is an interim stand-in for a genuine
# flat-color mode.
#
# To edit it: copy this file, unchanged, to
# ~/.config/hypr/hyprtail/presets/subtle.conf and set
# preset = "subtle" (no prefix). "prefab:<name>" is always the embedded
# built-in; a bare name is always your own file. The trail:vertex/fragment
# lines below name the embedded shaders; to edit those too, copy
# shaders/ribbon.vert and shaders/ribbon.frag into ~/.config/hypr/hyprtail/
# and change the values to "ribbon.vert" / "ribbon.frag" (bare = a path
# relative to ~/.config/hypr/hyprtail/).
contract = 2
description = Thin neutral trail, no idle effect
layers = trail

trail:vertex = prefab:ribbon.vert
trail:fragment = prefab:ribbon.frag
trail:fade_ms = 300
trail:width = 3
trail:miter_limit = 2
trail:color_slow = 0x40ffffff
trail:color_fast = 0x40ffffff
