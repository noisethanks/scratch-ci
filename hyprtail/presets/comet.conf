# A comet: a short tapered tail that pinches to a point, shedding a few
# twinkling star-shaped sparks behind it.
#
# "tail" is colored by the pointer's speed when each point was recorded
# (color_by = 0), from color_a (ice blue) toward color_b (hot amber) as speed
# approaches speed_ref, in px/ms. speed_ref is high here, so the hot color
# only shows on real flicks and ordinary motion stays cool. Try
# `params = "tail:speed_ref=1.5"` to make it flare on lighter movement.
#
# "sparks" throws two particles per point straight back along the motion
# (trailing near 1); each cools from amber to red as it fades
# (color_by = 1, life) and flickers (twinkle).
contract = 2
description = Short tapered tail, ice blue flaring to amber, shedding sparks
layers = sparks, tail

sparks:vertex = shaders/drift.vert
sparks:fragment = shaders/dots.frag
sparks:fade_ms = 260
sparks:count = 2
sparks:size = 2.5
sparks:speed = 80
sparks:wobble = 3
sparks:trailing = 0.9
sparks:shape = 2
sparks:softness = 0.2
sparks:twinkle = 0.5
sparks:twinkle_hz = 14
sparks:color_by = 1
sparks:color_a = 0xffffe27a
sparks:color_b = 0xffff5a1a

tail:vertex = shaders/ribbon.vert
tail:fragment = shaders/gradient.frag
tail:fade_ms = 180
tail:width = 5
tail:miter_limit = 2
tail:speed_ref = 4
tail:color_a = 0xff4d8dff
tail:color_b = 0xffffe27a
