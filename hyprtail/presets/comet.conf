# comet: short tail that pinches to a point, shedding a few twinkling stars.
# Tail is ice blue, flaring to amber on fast flicks.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - tail:   tail:width (5), tail:fade_ms (180, length)
#   - flare:  tail:speed_ref (4 px/ms; lower = amber on lighter motion)
#   - color:  tail:color_a (slow), tail:color_b (fast)
#   - sparks: sparks:count (2 per point), sparks:fade_ms (1250),
#             sparks:speed (80), sparks:size (2.5), sparks:enabled=false
#   - look:   sparks:shape (0 dot, 1 ring, 2 star), sparks:twinkle (0..1),
#             sparks:color_a / color_b (start / end of life)
contract = 2
description = Short tapered tail, ice blue flaring to amber, shedding sparks
layers = sparks, tail

sparks:vertex = shaders/drift.vert
sparks:fragment = shaders/dots.frag
sparks:fade_ms = 1250
sparks:count = 2
sparks:size = 2.5
sparks:speed = 80
sparks:wobble = 3
sparks:trailing = 0.9
sparks:shape = 2
sparks:softness = 0.2
sparks:twinkle = 0.5
sparks:twinkle_hz = 14
sparks:color_by = 1
sparks:color_a = 0xffffe27a
sparks:color_b = 0xffff5a1a

tail:vertex = shaders/taper.vert
tail:fragment = shaders/gradient.frag
tail:fade_ms = 180
tail:width = 5
tail:miter_limit = 2
tail:speed_ref = 4
tail:color_a = 0xff4d8dff
tail:color_b = 0xffffe27a
