# Fire: embers that rise off the trail and cool as they go, and a crackle of
# sparks around the pointer while it rests.
#
# "embers" (instanced) emits a few soft particles per point that drift in
# nearly random directions and are pulled UP the screen (gravity_dir = 0,-1;
# positive y is down). Each starts bright yellow and cools to deep red as it
# fades (color_by = 1, life), flickering a little. Reach is speed * fade_ms
# plus gravity * fade_ms^2 / 2, wobble and size: about 78 px.
#
# The trail buffer holds `capacity` points (default 64), and a point that is
# pushed out of it takes its embers with it, so long-lived embers vanish
# early during long fast strokes. Try `plugin:hyprtail:capacity = 256`.
#
# "crackle" (quad, idle) starts once the pointer has rested for start_ms and
# throws short jagged sparks now and then. duration_ms = 0 keeps it going
# until the pointer moves, which also keeps the monitor redrawing every frame
# for as long as it shows; `params = "crackle:duration_ms=8000"` stops it
# after 8 s, and "crackle:enabled=false" turns it off.
contract = 2
description = Rising embers that cool as they drift, crackling while idle
layers = embers, crackle

embers:vertex = prefab:drift.vert
embers:fragment = prefab:dots.frag
embers:fade_ms = 1400
embers:count = 2
embers:size = 2.2
embers:speed = 18
embers:wobble = 10
embers:trailing = 0.15
embers:gravity = 40
embers:gravity_dir = 0,-1
embers:softness = 0.9
embers:twinkle = 0.4
embers:twinkle_hz = 5
embers:color_by = 1
embers:color_a = 0xffffd580
embers:color_b = 0xffff3a00

crackle:vertex = prefab:halo.vert
crackle:fragment = prefab:sizzle.frag
crackle:start_ms = 600
crackle:duration_ms = 0
crackle:radius = 28
crackle:arcs = 3
crackle:interval_ms = 900
crackle:crackle_ms = 160
crackle:chance = 0.6
crackle:thickness = 1.2
crackle:color_a = 0xfffff0c0
crackle:color_b = 0xffff5a1a
