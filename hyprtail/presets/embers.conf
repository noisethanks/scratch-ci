# embers: fire. Soft particles rise off the trail and cool from yellow to
# red; a crackle of sparks appears around the pointer while it rests.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - embers: embers:count (2 per point), embers:size (2.2),
#             embers:fade_ms (1400), embers:wobble (10, sideways scatter)
#   - rise:   embers:gravity (40; 0 = no rise), embers:speed (18)
#   - color:  embers:color_a (hot), embers:color_b (cool)
#   - long strokes: raise plugin capacity (e.g. 256); points pushed out of
#     the buffer take their embers with them
#   - crackle: crackle:enabled=false to remove, crackle:duration_ms (0 = until
#     the pointer moves, which redraws every frame; 8000 stops it after 8 s),
#     crackle:start_ms (600), crackle:radius (28), crackle:color_a / color_b
contract = 2
description = Rising embers that cool as they drift, crackling while idle
layers = embers, crackle

embers:vertex = shaders/drift.vert
embers:fragment = shaders/dots.frag
embers:fade_ms = 1400
embers:count = 2
embers:size = 2.2
embers:speed = 18
embers:wobble = 10
embers:trailing = 0.15
embers:gravity = 40
embers:gravity_dir = 0,-1
embers:softness = 0.9
embers:twinkle = 0.4
embers:twinkle_hz = 5
embers:color_by = 1
embers:color_a = 0xffffd580
embers:color_b = 0xffff3a00

crackle:vertex = shaders/halo.vert
crackle:fragment = shaders/sizzle.frag
crackle:start_ms = 600
crackle:duration_ms = 0
crackle:radius = 28
crackle:arcs = 3
crackle:interval_ms = 900
crackle:crackle_ms = 160
crackle:chance = 0.6
crackle:thickness = 1.2
crackle:color_a = 0xfffff0c0
crackle:color_b = 0xffff5a1a
