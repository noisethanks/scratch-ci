# mosaic: the trail as a strip of hexagonal cells that drop out one by one as
# it fades. Cells stay anchored to the path. Sage and slate.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - color:  scales:color_a, scales:color_b, scales:alpha (0.7)
#   - size:   scales:width (36), scales:rows (4), scales:cell_px (9)
#             keep cell_px = width / rows for regular hexagons
#   - length: scales:fade_ms (800)
#   - look:   scales:gap (0.16), scales:dissolve (0 = fade all together),
#             scales:shimmer (0 = steady), scales:shimmer_hz (0.4)
contract = 2
description = Hexagonal cells that dissolve one by one along the path
layers = scales

scales:vertex      = shaders/taper.vert
scales:fragment    = shaders/hexagons.frag
scales:fade_ms     = 800
scales:width       = 36
scales:tail_power  = 0.7
scales:cell_px     = 9
scales:rows        = 4
scales:gap         = 0.16
scales:dissolve    = 0.85
scales:shimmer     = 0.35
scales:shimmer_hz  = 0.4
scales:alpha       = 0.7
scales:color_a     = rgba(7a9a86ff)
scales:color_b     = rgba(6f879fff)
