# A glowing ribbon (SPEC §13.7 "vivid", approximated with shipped parts): two
# ribbon layers over the same trail points. "glow" is drawn first (bottom): a
# wide, faint ribbon that lingers a little longer. "core" is drawn on top: a
# narrow, opaque, brighter ribbon. Both shade cyan (slow) to magenta (fast).
#
# Compositing is plain premultiplied "over" -- there is no per-layer blend
# override, and shaders/gradient.frag can't output alpha 0 with color, so the glow
# is a translucent halo, not additive light (SPEC §13.7 "Blending"). Both layers
# use the same speed_ref so their colors shift at the same speed. Try
# `params = "glow:width=40 core:width=6"`.
contract = 2
description = Cyan-to-magenta ribbon with a soft wide glow underneath
layers = glow, core

glow:vertex = shaders/taper.vert
glow:fragment = shaders/gradient.frag
glow:fade_ms = 450
glow:width = 26
glow:miter_limit = 2
glow:speed_ref = 2
glow:color_a = 0x3300e5ff
glow:color_b = 0x33ff2bd6

core:vertex = shaders/taper.vert
core:fragment = shaders/gradient.frag
core:fade_ms = 300
core:width = 4
core:miter_limit = 2
core:speed_ref = 2
core:color_a = 0xffa8f6ff
core:color_b = 0xffffa3ee
