# vivid: glowing ribbon. A wide faint "glow" under a narrow bright "core",
# both cyan when slow to magenta when fast. The glow is a translucent halo,
# not additive light.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - color:  glow:color_a / color_b, core:color_a / color_b (slow / fast)
#   - shift:  speed_ref on BOTH layers (2 px/ms; lower = magenta sooner)
#   - size:   glow:width (26), core:width (4), e.g. glow:width=40 core:width=6
#   - length: glow:fade_ms (450), core:fade_ms (300)
#   - halo:   glow:alpha, or glow:enabled=false for the core alone
contract = 2
description = Cyan-to-magenta ribbon with a soft wide glow underneath
layers = glow, core

glow:vertex = shaders/taper.vert
glow:fragment = shaders/gradient.frag
glow:fade_ms = 450
glow:width = 26
glow:miter_limit = 2
glow:speed_ref = 2
glow:color_a = 0x3300e5ff
glow:color_b = 0x33ff2bd6

core:vertex = shaders/taper.vert
core:fragment = shaders/gradient.frag
core:fade_ms = 300
core:width = 4
core:miter_limit = 2
core:speed_ref = 2
core:color_a = 0xffa8f6ff
core:color_b = 0xffffa3ee
