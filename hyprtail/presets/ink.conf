# A calligraphy stroke: one ribbon drawn as if by a flat nib held at 45
# degrees, so the line swells moving across the nib and thins to a hairline
# moving along it. The ink starts a warm paper white and cools to slate as it
# fades (color_by = 1, life), and the width only partly follows age (taper)
# so the stroke keeps its shape while it dries. Cheap: one path layer.
#
# Try `params = "ink:nib_angle=-30"` to turn the pen, or "ink:nib=0" for a
# round pen.
#
# The idle layer (a pulsing ring around the pointer once it rests) is off by
# default. Turn it on with `params = "idle:enabled=true"`, or set
# `idle:enabled = true` below.
#
# To edit this file: copy the hyprtail/ folder into ~/.config/hypr/ and set
# trail = "presets/ink.conf"
# (a path relative to ~/.config/hypr/hyprtail/; "builtin:ink" is always the
# embedded copy). The vertex/fragment lines below are paths relative to that
# same folder: your copy of this file reads them from disk, so editing
# shaders/taper.vert or shaders/gradient.frag there changes your look;
# "builtin:ink" reads the embedded shaders and never the disk.
contract = 2
description = Calligraphy pen stroke that swells and thins with direction
layers = ink, idle

ink:vertex = shaders/taper.vert
ink:fragment = shaders/gradient.frag
ink:fade_ms = 420
ink:width = 7
ink:miter_limit = 2
ink:taper = 0.6
ink:nib = 0.85
ink:nib_angle = 45
ink:color_by = 1
ink:color_a = 0xfff4efe6
ink:color_b = 0xff7d8ea3

idle:vertex = shaders/halo.vert
idle:fragment = shaders/pulse.frag
idle:enabled = false
idle:start_ms = 500
idle:duration_ms = 1500
idle:radius = 24
idle:draw_when_cursor_hidden = false
idle:color_a = 0xff1a66ff
