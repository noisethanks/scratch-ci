# ink: calligraphy stroke. Swells moving across the nib, thins moving along
# it. Paper white cooling to slate as it fades.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - pen:    ink:nib_angle (-90..90, 45), ink:nib (0 = round pen, 0.85)
#   - color:  ink:color_a (fresh ink), ink:color_b (faded ink)
#   - size:   ink:width (7), ink:taper (0..1, how much width follows age)
#   - length: ink:fade_ms (420)
#   - idle:   pulsing ring around a resting pointer, off by default;
#             idle:enabled=true, idle:start_ms (500), idle:radius (24),
#             idle:color_a
contract = 2
description = Calligraphy pen stroke that swells and thins with direction
layers = ink, idle

ink:vertex = shaders/taper.vert
ink:fragment = shaders/gradient.frag
ink:fade_ms = 420
ink:width = 7
ink:miter_limit = 2
ink:taper = 0.6
ink:nib = 0.85
ink:nib_angle = 45
ink:color_by = 1
ink:color_a = 0xfff4efe6
ink:color_b = 0xff7d8ea3

idle:vertex = shaders/halo.vert
idle:fragment = shaders/pulse.frag
idle:enabled = false
idle:start_ms = 500
idle:duration_ms = 1500
idle:radius = 24
idle:draw_when_cursor_hidden = false
idle:color_a = 0xff1a66ff
