# tether: a springy cord. The spring source drags a chain of points
# after the pointer; three layers draw it and differ ONLY in width, lateral
# offset and alpha: a faint 12 px wash, a 1.6 px rail 3.5 px to the left of
# travel and a 1.0 px rail 4 px to the right, slate blue. 620 ms life.
# Written for the default plugin:hyprtail:capacity of 64: age_step_ms 9 puts
# the last point at 567 ms, just inside fade_ms, so the tail tapers to a
# point. A different capacity wants age_step_ms = fade_ms * 0.9 / (capacity - 1).
#
# The damping is raised from the default 200 to 300 (damping ratio about
# 0.87, under 1 still bounces a little) so the cord settles without
# wobbling: judge whether it still feels alive.
#
# Judge: (1) the rails should stay parallel through bends, closing up where
# the strip narrows; (2) at rest the chain collapses under the cursor and
# the cord should vanish, leaving nothing behind; (3) the lag: the tail
# should trail by a few hundred ms without feeling detached; (4) the
# faint wash should not make the cord look blurred; (5) with a fast flick,
# the head should not overshoot visibly.
contract = 2
description = Springy cord, three layers differing in width, offset and alpha
layers = wash, rail_a, rail_b
source = spring

source:mass        = 1
source:stiffness   = 30000
source:damping     = 300
source:age_step_ms = 9

wash:vertex      = shaders/convex.vert
wash:fragment    = shaders/gradient.frag
wash:color_by    = 1
wash:fade_ms     = 620
wash:head_ms     = 120
wash:tail_curve  = 1
wash:softness        = 0.3
wash:color_a     = rgba(6f879fff)
wash:color_b     = rgba(566b80ff)
wash:width       = 12
wash:offset      = 0
wash:alpha       = 0.12

rail_a:vertex     = shaders/convex.vert
rail_a:fragment   = shaders/gradient.frag
rail_a:color_by   = 1
rail_a:fade_ms    = 620
rail_a:head_ms    = 120
rail_a:tail_curve = 1
rail_a:softness       = 0.3
rail_a:color_a    = rgba(6f879fff)
rail_a:color_b    = rgba(566b80ff)
rail_a:width      = 1.6
rail_a:offset     = -3.5
rail_a:alpha      = 0.65

rail_b:vertex     = shaders/convex.vert
rail_b:fragment   = shaders/gradient.frag
rail_b:color_by   = 1
rail_b:fade_ms    = 620
rail_b:head_ms    = 120
rail_b:tail_curve = 1
rail_b:softness       = 0.3
rail_b:color_a    = rgba(6f879fff)
rail_b:color_b    = rgba(566b80ff)
rail_b:width      = 1
rail_b:offset     = 4
rail_b:alpha      = 0.4
