# tether: springy cord. A faint wash and two thin rails alongside it, slate
# blue. Tuned for default capacity 64.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - color:  color_a / color_b on ALL of wash, rail_a, rail_b
#   - length: fade_ms (620) on ALL layers; with a different capacity set
#             source:age_step_ms = fade_ms * 0.9 / (capacity - 1)
#   - feel:   source:damping (300; lower = bouncier), source:stiffness (30000)
#   - shape:  wash:width (12), rail_a:width / rail_b:width (1.6 / 1),
#             rail_a:offset / rail_b:offset (-3.5 / 4 px from the center)
#   - strength: wash:alpha (0.12), rail_a:alpha (0.65), rail_b:alpha (0.4);
#             <layer>:enabled=false drops a layer
contract = 2
description = Springy cord, three layers differing in width, offset and alpha
layers = wash, rail_a, rail_b
source = spring

source:mass        = 1
source:stiffness   = 30000
source:damping     = 300
source:age_step_ms = 9

wash:vertex      = shaders/convex.vert
wash:fragment    = shaders/gradient.frag
wash:color_by    = 1
wash:fade_ms     = 620
wash:head_ms     = 120
wash:tail_curve  = 1
wash:softness        = 0.3
wash:color_a     = rgba(6f879fff)
wash:color_b     = rgba(566b80ff)
wash:width       = 12
wash:offset      = 0
wash:alpha       = 0.12

rail_a:vertex     = shaders/convex.vert
rail_a:fragment   = shaders/gradient.frag
rail_a:color_by   = 1
rail_a:fade_ms    = 620
rail_a:head_ms    = 120
rail_a:tail_curve = 1
rail_a:softness       = 0.3
rail_a:color_a    = rgba(6f879fff)
rail_a:color_b    = rgba(566b80ff)
rail_a:width      = 1.6
rail_a:offset     = -3.5
rail_a:alpha      = 0.65

rail_b:vertex     = shaders/convex.vert
rail_b:fragment   = shaders/gradient.frag
rail_b:color_by   = 1
rail_b:fade_ms    = 620
rail_b:head_ms    = 120
rail_b:tail_curve = 1
rail_b:softness       = 0.3
rail_b:color_a    = rgba(6f879fff)
rail_b:color_b    = rgba(566b80ff)
rail_b:width      = 1
rail_b:offset     = 4
rail_b:alpha      = 0.4
