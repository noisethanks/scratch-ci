# thread: the thinnest useful trail. A hairline strip pointed at both ends,
# sage green.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - color:  thread:color_a (fresh), thread:color_b (faded), thread:alpha (0.75)
#   - size:   thread:width (2.4)
#   - length: thread:fade_ms (450)
#   - ends:   thread:head_ms (150, head taper), thread:tail_curve (1.2)
#   - edge:   thread:softness (0 hard .. 1 soft, 0.2)
contract = 2
description = Thin ribbon, pointed at both ends
layers = thread

thread:vertex     = shaders/convex.vert
thread:fragment   = shaders/gradient.frag
thread:color_by    = 1
thread:fade_ms    = 450
thread:width      = 2.4
thread:head_ms    = 150
thread:tail_curve = 1.2
thread:softness       = 0.2
thread:alpha      = 0.75
thread:color_a    = rgba(6f9480ff)
thread:color_b    = rgba(54705fff)
