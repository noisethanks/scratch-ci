# A rope that chases the pointer: a chain of points, each one springing
# after the one before it, so the tail swings and settles instead of
# replaying where the pointer went. The chain has `capacity` points and they
# never pile up into a history: when the pointer stops the rope springs
# together under the cursor and fades.
#
# source:stiffness and source:damping set how quickly and how bouncily a
# point answers the one before it (damping ratio = damping / (2 *
# sqrt(stiffness * mass)), under 1 bounces); every link adds lag, so the
# numbers are large. source:age_step_ms is how much older each point is than
# the one in front of it: it tapers the ribbon toward the tail, and with
# trail:fade_ms decides how many points are visible (fade_ms / age_step_ms).
# Try `params = "source:damping=120 source:age_step_ms=6"` for a livelier,
# longer rope.
contract = 2
description = A springy rope of points chasing the pointer
layers = trail
source = spring

source:mass = 1
source:stiffness = 30000
source:damping = 200
source:age_step_ms = 10

trail:vertex = prefab:ribbon.vert
trail:fragment = prefab:gradient.frag
trail:fade_ms = 640
trail:width = 6
trail:miter_limit = 2
trail:speed_ref = 3
trail:color_a = 0xff7a5cff
trail:color_b = 0xffff9ad5
