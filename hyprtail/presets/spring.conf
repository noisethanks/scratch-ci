# spring: a rope of points that chase the pointer, so the tail swings and
# settles instead of replaying the path. Springs together and fades at rest.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - feel:   source:damping (200; below ~sqrt(stiffness*mass)*2 bounces),
#             source:stiffness (30000), source:mass (1)
#   - length: trail:fade_ms (640) / source:age_step_ms (10) = visible points,
#             at most plugin capacity
#   - look:   trail:width (6), trail:color_a (slow), trail:color_b (fast),
#             trail:speed_ref (3 px/ms)
#   - livelier, longer rope: source:damping=120 source:age_step_ms=6
contract = 2
description = A springy rope of points chasing the pointer
layers = trail
source = spring

source:mass = 1
source:stiffness = 30000
source:damping = 200
source:age_step_ms = 10

trail:vertex = shaders/taper.vert
trail:fragment = shaders/gradient.frag
trail:fade_ms = 640
trail:width = 6
trail:miter_limit = 2
trail:speed_ref = 3
trail:color_a = 0xff7a5cff
trail:color_b = 0xffff9ad5
