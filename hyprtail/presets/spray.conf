# Particles thrown off the trail (SPEC §13.3, instanced topology, reach that
# grows with age): each node emits `count` particles that drift away, mostly
# behind the pointer's motion, while shrinking and fading over fade_ms. The
# layer's reach is speed * fade_ms plus the wobble and size, so a long fade
# or a high speed widens the damaged area. Try
# `params = "trail:count=12 trail:speed=120"`.
contract = 2
description = Particle spray behind the pointer (instanced, age-driven growth)
layers = trail

trail:vertex = prefab:drift.vert
trail:fragment = prefab:dots.frag
trail:fade_ms = 700
trail:count = 4
trail:size = 3
trail:speed = 60
trail:wobble = 6
trail:trailing = 0.6
trail:color_a = 0xffffffff
trail:color_b = 0xffff8a1a
trail:softness = 0.6
