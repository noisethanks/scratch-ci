# A cloud of small dots scattered around every trail node (SPEC §13.3,
# instanced topology, bounded reach): each node draws `copies` dots at fixed
# random offsets of at most `spread` px, and the dots shrink as the node
# fades. Try `params = "trail:copies=16 trail:spread=24"`.
contract = 2
description = Scattered dots around the trail (instanced, bounded offset)
layers = trail

trail:vertex = prefab:scatter.vert
trail:fragment = prefab:dots.frag
trail:fade_ms = 500
trail:copies = 6
trail:size = 3
trail:spread = 10
trail:color_a = 0xffffffff
trail:color_b = 0xff1a66ff
trail:softness = 0.6
