# jitter: cloud of small dots scattered around every trail point, shrinking
# as they fade. Each dot gets a fixed random mix of white and blue.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - density: trail:copies (1..64, 6) dots per point
#   - spread:  trail:spread (10 px max offset), trail:size (3 px)
#   - color:   trail:color_a, trail:color_b (mixed per dot)
#   - length:  trail:fade_ms (500), plugin capacity
#   - edge:    trail:softness (0 hard .. 1 soft, 0.6)
#   - cost:    copies x visible points, keep copies modest with high capacity
contract = 2
description = Scattered dots around the trail (instanced, bounded offset)
layers = trail

trail:vertex = shaders/scatter.vert
trail:fragment = shaders/dots.frag
trail:fade_ms = 500
trail:copies = 6
trail:size = 3
trail:spread = 10
trail:color_a = 0xffffffff
trail:color_b = 0xff1a66ff
trail:softness = 0.6
