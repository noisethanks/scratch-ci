# The default preset, "prefab:subtle" (SPEC §13.7): one narrow ribbon, short
# fade, neutral low alpha, no idle layer. color_a and color_b are equal, so
# the color never shifts: a flat-color line.
#
# To edit it: copy the hyprtail/ folder into ~/.config/hypr/ and set
# trail = "presets/subtle.conf"
# (a path relative to ~/.config/hypr/hyprtail/; "prefab:subtle" is always the
# embedded copy). The thread:vertex/fragment lines below are paths relative to
# that same folder: your copy of this file reads them from disk, so editing
# shaders/ribbon.vert or shaders/gradient.frag there changes your look;
# "prefab:subtle" reads the embedded shaders and never the disk.
contract = 2
description = Thin neutral trail, no idle effect
layers = thread

thread:vertex = shaders/ribbon.vert
thread:fragment = shaders/gradient.frag
thread:fade_ms = 200
thread:width = 5
thread:miter_limit = 2
thread:color_a = 0x40ffffff
thread:color_b = 0x40ffffff
