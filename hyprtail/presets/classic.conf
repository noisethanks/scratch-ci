# Today's stock look (SPEC §13.7): a narrow speed-tinted ribbon, plus an
# idle ring around the pointer, off by default. Exists so switching to the
# manifest-driven preset system doesn't change anyone's default experience.
contract = 2
description = Speed-tinted ribbon, optional idle ring
layers = trail, idle

trail:vertex = shaders/ribbon.vert
trail:fragment = shaders/gradient.frag
trail:fade_ms = 500
trail:width = 8
trail:miter_limit = 2
trail:color_a = 0xff1a66ff
trail:color_b = 0xffff1a1a

idle:vertex = shaders/halo.vert
idle:fragment = shaders/pulse.frag
idle:enabled = false
idle:start_ms = 500
idle:duration_ms = 1500
idle:radius = 24
idle:draw_when_cursor_hidden = false
idle:color_a = 0xff1a66ff
