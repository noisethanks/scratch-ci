# snake: a comet-shaped body made of a twisting pair of strands. A
# 20 px head drawing out to a needle (taper.vert) with the helix shading
# (strands.frag) inside it: the strands narrow with the body and vanish into
# the tail. Clay and mauve strands, 75% alpha, 650 ms life.
#
# Judge: (1) the twist should survive the narrowing, with strands
# converging at the tail instead of breaking up; (2) compare it with
# helix: same shading, different geometry.
contract = 2
description = Comet-shaped helix on the ribbon geometry
layers = core

core:vertex     = shaders/taper.vert
core:fragment   = shaders/strands.frag
core:fade_ms    = 650
core:width      = 20
core:tail_power = 1
core:pitch_px   = 34
core:amp        = 0.62
core:strand_px  = 1.1
core:spin       = 1.6
core:depth      = 0.5
core:rung_px    = 17
core:rung_alpha = 0.2
core:alpha      = 0.75
core:color_a    = rgba(a98e74ff)
core:color_b    = rgba(8f7fa8ff)
