# snake: comet-shaped body of a twisting pair of strands that converge into a
# needle tail. Clay and mauve.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - color:  core:color_a, core:color_b (the two strands), core:alpha (0.75)
#   - size:   core:width (20), core:strand_px (1.1)
#   - length: core:fade_ms (650), core:tail_power (1; higher = sharper tail)
#   - twist:  core:pitch_px (34), core:amp (0..1), core:spin (1.6; 0 = still)
#   - rungs:  core:rung_px (17; 0 = none), core:rung_alpha (0.2)
contract = 2
description = Comet-shaped helix on the ribbon geometry
layers = core

core:vertex     = shaders/taper.vert
core:fragment   = shaders/strands.frag
core:fade_ms    = 650
core:width      = 20
core:tail_power = 1
core:pitch_px   = 34
core:amp        = 0.62
core:strand_px  = 1.1
core:spin       = 1.6
core:depth      = 0.5
core:rung_px    = 17
core:rung_alpha = 0.2
core:alpha      = 0.75
core:color_a    = rgba(a98e74ff)
core:color_b    = rgba(8f7fa8ff)
