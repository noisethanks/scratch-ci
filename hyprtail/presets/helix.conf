# helix: two thin strands winding around a faint sheath, a helix seen
# from the side, with fine rungs between them. The strip is 26 px wide and
# tapers at both ends, the strands taper with it. Mauve and slate strands,
# 75% alpha, sheath 7%, 700 ms life.
#
# Judge: (1) the strands should keep the same hairline thickness along the
# whole trail and through turns; (2) the nearer strand should read as in
# front at each crossing (strands:depth); (3) a fast flick should keep the
# helix intact, not alias into noise: it is drawn per pixel, not per node;
# (4) the slow rotation (strands:spin) should be calm, not busy: set it to 0
# to compare; (5) rungs (strands:rung_px) should not look like a ladder;
# (6) on a 2x output the hairlines are half as thick (strand_px is in
# device pixels).
contract = 2
description = Twin-strand helix with rungs
layers = sheath, strands

sheath:vertex     = shaders/convex.vert
sheath:fragment   = shaders/gradient.frag
sheath:color_by   = 1
sheath:fade_ms    = 700
sheath:width      = 26
sheath:head_ms    = 200
sheath:softness       = 1
sheath:alpha      = 0.07
sheath:color_a    = rgba(8f7fa8ff)
sheath:color_b    = rgba(8f7fa8ff)

strands:vertex     = shaders/convex.vert
strands:fragment   = shaders/strands.frag
strands:fade_ms    = 700
strands:width      = 26
strands:head_ms    = 200
strands:tail_curve = 0.8
strands:pitch_px   = 38
strands:amp        = 0.6
strands:strand_px  = 1.2
strands:spin       = 1.2
strands:depth      = 0.5
strands:rung_px    = 19
strands:rung_alpha = 0.25
strands:alpha      = 0.75
strands:color_a    = rgba(8f7fa8ff)
strands:color_b    = rgba(6f879fff)
