# helix: two thin strands winding around a faint sheath, with fine rungs
# between them. Mauve and slate, tapering at both ends.
#
# Tweak (params = "layer:key=value ..."; colors are 0xAARRGGBB or rgba(RRGGBBAA)):
#   - color:  strands:color_a, strands:color_b; sheath:color_a / color_b
#   - size:   width on BOTH layers (26), strand_px (1.2, hairline thickness)
#   - length: fade_ms on BOTH layers (700)
#   - twist:  strands:pitch_px (38), strands:amp (0..1), strands:spin (1.2;
#             0 = still, negative reverses)
#   - rungs:  strands:rung_px (19; 0 = none), strands:rung_alpha (0.25)
#   - fade:   strands:alpha (0.75), sheath:alpha (0.07), sheath:enabled=false
contract = 2
description = Twin-strand helix with rungs
layers = sheath, strands

sheath:vertex     = shaders/convex.vert
sheath:fragment   = shaders/gradient.frag
sheath:color_by   = 1
sheath:fade_ms    = 700
sheath:width      = 26
sheath:head_ms    = 200
sheath:softness       = 1
sheath:alpha      = 0.07
sheath:color_a    = rgba(8f7fa8ff)
sheath:color_b    = rgba(8f7fa8ff)

strands:vertex     = shaders/convex.vert
strands:fragment   = shaders/strands.frag
strands:fade_ms    = 700
strands:width      = 26
strands:head_ms    = 200
strands:tail_curve = 0.8
strands:pitch_px   = 38
strands:amp        = 0.6
strands:strand_px  = 1.2
strands:spin       = 1.2
strands:depth      = 0.5
strands:rung_px    = 19
strands:rung_alpha = 0.25
strands:alpha      = 0.75
strands:color_a    = rgba(8f7fa8ff)
strands:color_b    = rgba(6f879fff)
