name: Smoke

# hyprtail's lifecycle smoke test (tests/hyprtester/hyprtail_smoke.cpp: load,
# duplicate refusal, hotplug, unload/reload, crash-loop guard) in a NixOS VM,
# against the pinned Hyprland. Never required. Run it by hand before a
# release; the weekly run keeps it from rotting unnoticed. A cold cache
# builds Hyprland more than once (NOTES "Smoke job: the triple Hyprland
# build"), hence the long timeout (docs/CI.md "smoke.yml").
on:
  schedule:
    - cron: "41 6 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

env:
  # Same pin as ci.yml's NIX_PIN; move them together.
  NIX_PIN: >-
    --override-input hyprland github:hyprwm/Hyprland?ref=v0.56.2
    --override-input hyprland/nixpkgs github:NixOS/nixpkgs/61b7c44c4073f0b827768aff0049561b5110ea5a
    --no-write-lock-file

jobs:
  smoke:
    name: smoke-pin
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # The VM is a QEMU guest. Without /dev/kvm it boots under software
      # emulation and hits the timeout with no error saying why.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing on this runner"
            exit 1
          fi

      - id: nix
        uses: ./.github/actions/nix-setup
        with:
          cache-key-suffix: smoke

      # 10 minutes under the job's, so the cache save below still runs.
      - name: Build and run the smoke VM
        timeout-minutes: 140
        run: |
          set -euo pipefail
          read -ra pin <<<"$NIX_PIN"
          nix build ".#legacyPackages.x86_64-linux.smoke" -L "${pin[@]}"

      # The VM test succeeds once the machine ran, so logs come out either
      # way (nix/smoke.nix); hyprtester's status is in a file.
      - name: Check exit status
        run: |
          set -euo pipefail
          status="$(cat result/exit_status)"
          echo "hyprtester exit status: ${status}"
          [ "${status}" = 0 ]

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: result
          if-no-files-found: ignore
          retention-days: 14

      # Even on timeout or failure: finished derivations are in the store.
      - name: Save Nix store
        if: always()
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix.outputs.cache-key }}
          gc-max-store-size-linux: 5G
