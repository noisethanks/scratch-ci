# demo-comet-helix: a comet whose body is a twisting pair of strands. A
# 20 px head drawing out to a needle (comet.vert) with the helix shading
# (strands.frag) inside it: the strands narrow with the body and vanish into
# the tail. Clay and mauve strands, 75% alpha, 650 ms life.
#
# Judge: (1) the twist should survive the narrowing, with strands
# converging at the tail instead of breaking up; (2) at the head, the swelling
# (core:bulb) should not distort the strand spacing visibly; (3) compare it
# with demo-helix: same shading, different geometry.
contract = 2
description = Demo: comet-shaped helix
layers = core

core:vertex     = shaders/comet.vert
core:fragment   = shaders/strands.frag
core:fade_ms    = 650
core:width      = 20
core:curve      = 1
core:bulb       = 0.15
core:bulb_ms    = 120
core:pitch_px   = 34
core:amp        = 0.62
core:strand_px  = 1.1
core:spin       = 1.6
core:depth      = 0.5
core:rung_px    = 17
core:rung_alpha = 0.2
core:alpha      = 0.75
core:color_a    = rgba(a98e74ff)
core:color_b    = rgba(8f7fa8ff)
