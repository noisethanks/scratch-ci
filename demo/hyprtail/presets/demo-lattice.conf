# demo-lattice: the trail as a strip of hexagonal cells, each with its own
# tint, flicker phase and moment of dying. A 36 px strip, 4 cells across
# (cell_px 9 = 36 / 4 makes the hexagons regular), sage and slate, 70%
# alpha, 800 ms life. The cells are anchored to the path, so they stay put
# as the trail moves.
#
# Judge: (1) the cells should stay put along the path while you move, not
# crawl; (2) as the trail fades, cells should drop out one by one, leaving
# a few last cells, not fade all together (scales:dissolve 0 shows the
# difference); (3) the flicker (scales:shimmer) should be barely
# noticeable; (4) where the strip tapers, the cells squash with it: decide
# whether that reads as scales or as distortion; (5) cell size at 1x and
# 2x scale.
contract = 2
description = Demo: hexagonal cell lattice over the path
layers = scales

scales:vertex      = shaders/taper.vert
scales:fragment    = shaders/lattice.frag
scales:fade_ms     = 800
scales:width       = 36
scales:head_ms     = 240
scales:tail_curve  = 0.7
scales:cell_px     = 9
scales:rows        = 4
scales:gap         = 0.16
scales:dissolve    = 0.85
scales:shimmer     = 0.35
scales:shimmer_hz  = 0.4
scales:alpha       = 0.7
scales:color_a     = rgba(7a9a86ff)
scales:color_b     = rgba(6f879fff)
