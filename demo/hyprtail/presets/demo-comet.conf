# demo-comet: a quiet comet. A short body that is fattest just behind the
# pointer and draws out to a needle, over a very faint wide aura. Muted slate
# blue, 70% alpha body, 16% aura, 520 ms life.
#
# Judge: (1) the tail should end in a clean point, not a stub, as it fades;
# (2) the swelling at the head (bulb) should read as weight, not as a blob:
# if it pulses while you move slowly, lower layer body:bulb; (3) the aura
# should be felt more than seen, on a white window as much as a black one;
# (4) a fast flick should not leave gaps or spikes at sharp turns.
#
# Both layers share comet.vert and softline.frag and differ only in
# parameters. Shaders are in ../shaders/ (demo/hyprtail/shaders).
contract = 2
description = Demo: quiet comet, needle tail over a faint aura
layers = aura, body

aura:vertex   = shaders/comet.vert
aura:fragment = shaders/softline.frag
aura:fade_ms  = 520
aura:width    = 18
aura:curve    = 1.2
aura:bulb     = 0.3
aura:bulb_ms  = 120
aura:soft     = 1
aura:alpha    = 0.16
aura:color_a  = rgba(6f879fff)
aura:color_b  = rgba(6f879fff)

body:vertex   = shaders/comet.vert
body:fragment = shaders/softline.frag
body:fade_ms  = 520
body:width    = 5.5
body:curve    = 1.8
body:bulb     = 0.55
body:bulb_ms  = 90
body:soft     = 0.45
body:alpha    = 0.7
body:color_a  = rgba(6f879fff)
body:color_b  = rgba(4f6377ff)
