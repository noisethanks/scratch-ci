# demo-thread: the thinnest useful trail. A 2.4 px strip that grows from a
# point at the head, runs at full width, and thins back to a point at the
# tail. Sage green, 75% alpha, 450 ms life.
#
# Judge: (1) both ends should be pointed; the head taper is a time ramp
# (taper.vert head_ms), so it is sharp while you move and relaxes once you
# stop; (2) on a slow drag, check the head does not shimmer in width as
# nodes arrive (head_ms vs min_spacing); (3) the line should stay visible on
# both a light and a dark window without drawing the eye.
contract = 2
description = Demo: thin ribbon, pointed at both ends
layers = thread

thread:vertex     = shaders/taper.vert
thread:fragment   = shaders/softline.frag
thread:fade_ms    = 450
thread:width      = 2.4
thread:head_ms    = 150
thread:tail_curve = 1.2
thread:soft       = 0.2
thread:alpha      = 0.75
thread:color_a    = rgba(6f9480ff)
thread:color_b    = rgba(54705fff)
